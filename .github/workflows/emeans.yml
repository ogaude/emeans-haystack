name: Test / emeans

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "integrations/emeans/**"
      - "!integrations/emeans/*.md"
      - ".github/workflows/emeans.yml"
  push:
    branches:
      - main
    paths:
      - "integrations/emeans/**"
      - "!integrations/emeans/*.md"
      - ".github/workflows/emeans.yml"

concurrency:
  group: emeans-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"
  TEST_MATRIX_OS: '["ubuntu-latest"]'
  TEST_MATRIX_PYTHON: '["3.11", "3.15"]'

defaults:
  run:
    working-directory: integrations/emeans

jobs:
  compute-test-matrix:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    outputs:
      os: ${{ steps.set.outputs.os }}
      python-version: ${{ steps.set.outputs.python-version }}
    steps:
      - id: set
        run: |
          echo 'os=${{ github.event_name == 'push' && '["ubuntu-latest"]' || env.TEST_MATRIX_OS }}' >> "$GITHUB_OUTPUT"
          echo 'python-version=${{ github.event_name == 'push' && '["3.11"]' || env.TEST_MATRIX_PYTHON }}' >> "$GITHUB_OUTPUT"

  run:
    name: Python ${{ matrix.python-version }} on Linux
    needs: compute-test-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # faiss-cpu e-means is only verified on Linux.
        os: ${{ fromJSON(needs.compute-test-matrix.outputs.os) }}
        python-version: ${{ fromJSON(needs.compute-test-matrix.outputs.python-version) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Hatch
        run: |
          python -m pip install --upgrade pip
          pip install hatch --uploaded-prior-to=P1D

      - name: Lint
        if: matrix.python-version == '3.11' && runner.os == 'Linux'
        run: hatch run fmt-check && hatch run test:types

      - name: Run unit tests
        run: hatch run test:unit-cov-retry

      - name: Run unit tests with lowest direct dependencies
        if: matrix.python-version == '3.11' && runner.os == 'Linux'
        run: |
          hatch env prune
          hatch run uv pip compile pyproject.toml --resolution lowest-direct --output-file requirements_lowest_direct.txt
          hatch -e test env run -- uv pip install -r requirements_lowest_direct.txt
          hatch run test:unit

      - name: Nightly - run unit tests with Haystack main branch
        if: github.event_name == 'schedule'
        run: |
          hatch env prune
          hatch -e test env run -- uv pip install git+https://github.com/deepset-ai/haystack.git@main
          hatch run test:unit

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install Hatch
        run: |
          python -m pip install --upgrade pip
          pip install hatch --uploaded-prior-to=P1D

      - name: Build
        run: hatch build

      - name: Check distributions
        run: |
          test "$(ls dist/emeans_haystack-*.whl | wc -l)" = 1
          test "$(ls dist/emeans_haystack-*.tar.gz | wc -l)" = 1
          unzip -p dist/*.whl '*.dist-info/METADATA' > "$RUNNER_TEMP/METADATA"
          grep -E '^Name: emeans-haystack$' "$RUNNER_TEMP/METADATA"
          grep -Fx "Version: $(hatch version)" "$RUNNER_TEMP/METADATA"
          grep -E '^License-Expression: Apache-2.0$' "$RUNNER_TEMP/METADATA"
          grep -E '^Requires-Dist: numpy>=2.0' "$RUNNER_TEMP/METADATA"
          grep -E '^Requires-Dist: faiss-cpu>=1.16.0' "$RUNNER_TEMP/METADATA"
          grep -E '^Requires-Dist: haystack-ai>=3.5' "$RUNNER_TEMP/METADATA"
