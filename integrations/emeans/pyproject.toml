[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "emeans-haystack"
dynamic = ["version"]
description = "Haystack components that cluster document embeddings with e-means (Meta FAIR)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = []
authors = [{ name = "ogaude", email = "ogaude.code@proton.me" }]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
]
# faiss-cpu 1.16.0 imports numpy._core, which exists only in numpy 2.x.
dependencies = ["haystack-ai>=3.5", "faiss-cpu>=1.16.0", "numpy>=2.0", "packaging>=22"]

[project.optional-dependencies]
gpu = ["torch"]

[project.urls]
Documentation = "https://github.com/ogaude/emeans-haystack/tree/main/integrations/emeans#readme"
Issues = "https://github.com/ogaude/emeans-haystack/issues"
Source = "https://github.com/ogaude/emeans-haystack/tree/main/integrations/emeans"

[tool.hatch.build.targets.wheel]
packages = ["src/haystack_integrations"]

[tool.hatch.version]
source = "vcs"
tag-pattern = 'integrations\/emeans-v(?P<version>.*)'

[tool.hatch.version.raw-options]
root = "../.."
git_describe_command = 'git describe --tags --match="integrations/emeans-v[0-9]*"'

[tool.hatch.envs.default]
installer = "uv"
dependencies = ["haystack-pydoc-tools", "ruff"]

[tool.hatch.envs.default.scripts]
docs = ["haystack-pydoc pydoc/config_docusaurus.yml"]
fmt = "ruff check --fix {args}; ruff format {args}"
fmt-check = "ruff check {args} && ruff format --check {args}"

[tool.hatch.envs.test]
dependencies = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-rerunfailures",
    "mypy",
    "pip",
]

[tool.hatch.envs.test.scripts]
unit = 'pytest -m "not integration" {args:tests}'
integration = 'pytest -m "integration" {args:tests}'
all = 'pytest {args:tests}'
unit-cov-retry = 'pytest --cov=haystack_integrations --reruns 3 --reruns-delay 30 -x -m "not integration" {args:tests}'
integration-cov-append-retry = 'pytest --cov=haystack_integrations --cov-append --reruns 3 --reruns-delay 30 -x -m "integration" {args:tests}'
types = "mypy -p haystack_integrations.components.preprocessors.emeans -p haystack_integrations.components.rankers.emeans {args}"

[tool.hatch.envs.examples]
template = "test"
extra-dependencies = ["sentence-transformers-haystack"]
env-vars = { UV_TORCH_BACKEND = "cpu" }

[tool.hatch.envs.examples.scripts]
run = "python {args}"
integration = 'pytest -m integration {args:tests}'

# Local-only AMD ROCm env (RX 9060 XT): not used by CI, droppable on the upstream move.
# Accepted risk: with `unsafe-best-match`, any package published on the AMD index with a higher version than on
# PyPI wins (dependency confusion). Hatch installs extra-dependencies as plain `uv pip` requirements, outside uv's
# project mode, so an explicit `[tool.uv.index]` + `[tool.uv.sources]` pin for torch is not relied on here. The env is
# never built in CI, torch is pinned to an exact +rocm version, and the AMD index is a vendor index. The `gpu-fork`
# env below applies the same reasoning to its exact `emeans-rocm` pin.
[tool.hatch.envs.gpu]
template = "test"
extra-dependencies = ["torch[device-{env:EMEANS_ROCM_GFX:gfx1200}]==2.14.0+rocm10.1.0"]
env-vars = { UV_EXTRA_INDEX_URL = "https://stable.repo.amd.com/rocm/whl-next/", UV_INDEX_STRATEGY = "unsafe-best-match" }

[tool.hatch.envs.gpu.scripts]
gpu-tests = 'pytest -m gpu {args:tests}'
unit = 'pytest -m "not integration" {args:tests}'
run = "python {args}"

# Local only: installs `emeans-rocm` 0.2.5 from PyPI on top of the ROCm torch of the `gpu` env. A child env's
# `extra-dependencies` replace the template list, so the torch pin is repeated here. The accepted dependency-confusion
# risk of the `gpu` env (unsafe-best-match with the AMD extra index) also covers `emeans-rocm`: it is pinned exactly,
# PyPI is the intended source, the AMD index returned 404 for `emeans-rocm` on 2026-11-23, and the pin is revisited
# by hand, never auto-bumped.
[tool.hatch.envs.gpu-fork]
template = "gpu"
extra-dependencies = ["torch[device-{env:EMEANS_ROCM_GFX:gfx1200}]==2.14.0+rocm10.1.0", "emeans-rocm==0.2.5"]

[tool.mypy]
install_types = true
non_interactive = true
check_untyped_defs = true
disallow_incomplete_defs = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ARG",
    "B",
    "C",
    "D102",   # Missing docstring in public method
    "D103",   # Missing docstring in public function
    "D205",   # 1 blank line required between summary line and description
    "D209",   # Closing triple quotes go to new line
    "D213",   # summary lines must be positioned on the second physical line of the docstring
    "D417",   # Missing argument descriptions in the docstring
    "D419",   # Docstring is empty
    "DTZ",
    "E",
    "EM",
    "F",
    "I",
    "ICN",
    "ISC",
    "N",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
    "Q",
    "RUF",
    "S",
    "T",
    "TID",
    "UP",
    "W",
    "YTT",
]
ignore = [
    # Allow non-abstract empty methods in abstract base classes
    "B027",
    # Allow function calls in argument defaults (common Haystack pattern for Secret.from_env_var)
    "B008",
    # Ignore checks for possible passwords
    "S105",
    "S106",
    "S107",
    # Ignore complexity
    "C901",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    # Allow `Any` type - used legitimately for dynamic types and SDK boundaries
    "ANN401",
]

[tool.ruff.lint.isort]
known-first-party = ["haystack_integrations"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.per-file-ignores]
# Tests can use magic values, assertions, relative imports, and don't need type annotations
"tests/**/*" = ["PLR2004", "S101", "TID252", "D", "ANN"]

[tool.coverage.run]
source = ["haystack_integrations"]
branch = true
parallel = false
relative_files = true

[tool.coverage.report]
omit = ["*/tests/*", "*/__init__.py"]
show_missing = true
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
  "integration: integration tests",
  "gpu: needs a GPU; local only",
]
log_cli = true
asyncio_default_fixture_loop_scope = "function"
